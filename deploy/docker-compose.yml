# Runs QubeEx backend + Caddy (HTTPS) on the Oracle server.
# On the server:  cd ~/qubeex/deploy && docker compose up -d --build
services:
  backend:
    build:
      context: ..            # repo root, where the Dockerfile is
    image: qubeex-backend
    container_name: qubeex-backend
    env_file: ../.env        # secrets live only on the server, never in git
    environment:
      PORT: "3000"
    restart: always          # auto-restart on crash and after server reboot
    expose:
      - "3000"               # reachable by Caddy only, not from the internet
    depends_on:
      - redis
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }   # keep logs from filling the disk

  # Our own Redis (cache, rate limits, counters). Not exposed to the internet:
  # only containers in this compose file can reach it, at redis://redis:6379
  redis:
    image: redis:7-alpine
    container_name: qubeex-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data       # saved to disk, survives restarts
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    container_name: qubeex-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # HTTPS certificates are stored here
      - caddy_config:/config
    depends_on:
      - backend

  # GPS server for live bus tracking. Trackers / test phones send locations
  # to it; it decodes every tracker brand and (later) forwards to the backend.
  traccar:
    image: traccar/traccar:6.16-alpine
    container_name: qubeex-traccar
    restart: always
    ports:
      - "5055:5055"              # OsmAnd (Traccar Client phone app, test script)
      - "5023:5023"              # GT06 trackers (for later)
      - "127.0.0.1:8082:8082"    # admin web page: server-only, use an SSH tunnel
    volumes:
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar_data:/opt/traccar/data      # devices + positions, survives restarts
      - traccar_logs:/opt/traccar/logs
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  redis_data:
  caddy_data:
  caddy_config:
  traccar_data:
  traccar_logs:
